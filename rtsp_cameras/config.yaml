name: RTSP Camera Manager
version: "0.1.6"
slug: rtsp_cameras
description: >-
  Add RTSP camera instances to Home Assistant using only the stream URL. Name
  them, check that the stream works, preview it live and use every instance as a
  camera entity on any dashboard.
url: https://github.com/skydiveTom/home-assistant-rtsp-camera
# Prebuilt multi-arch image, published by .github/workflows/build-addon.yml.
# Supervisor pulls this image instead of building the app on the host.
# Container registry paths must be lowercase.
image: ghcr.io/skydivetom/rtsp-cameras
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# The Home Assistant base images ship s6-overlay as ENTRYPOINT, so the app
# provides its own init and Docker must not add one in front of it.
init: false
stage: stable
map:
  - type: homeassistant_config
    read_only: false
    path: /config
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: RTSP Cameras
panel_admin: false
watchdog: http://[HOST]:[PORT:8099]/health
options:
  language: auto
  default_rtsp_transport: tcp
  install_integration: true
  ha_restart_after_install: false
  health_check_interval: 60
  test_timeout: 15
  preview_mode: mjpeg
  preview_max_height: 1080
  preview_fps: 5
  redact_credentials_in_logs: true
schema:
  language: list(auto|en|de|es|pl)
  default_rtsp_transport: list(tcp|udp|udp_multicast|http)
  install_integration: bool
  ha_restart_after_install: bool
  health_check_interval: int(0,86400)
  test_timeout: int(5,120)
  preview_mode: list(mjpeg|hls)
  preview_max_height: int(240,2160)
  preview_fps: int(1,30)
  redact_credentials_in_logs: bool