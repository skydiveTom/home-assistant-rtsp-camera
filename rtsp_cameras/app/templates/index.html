<!DOCTYPE html>
<html lang="{{ language }}" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ base_path }}/static/app.css">
  <link rel="icon" href="{{ base_path }}/static/icon.svg" type="image/svg+xml">
</head>
<body>
  <header class="masthead">
    <div class="masthead__glow" aria-hidden="true"></div>
    <div class="masthead__inner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2.5" y="9" width="20" height="14" rx="3"></rect>
          <path d="M22.5 14.5 29 11v10l-6.5-3.5z"></path>
          <circle cx="8.5" cy="16" r="2.6" class="brand__lens"></circle>
          <path class="brand__wave" d="M12.4 12.4a5 5 0 0 1 0 7.2M15 10.4a8 8 0 0 1 0 11.2"></path>
        </svg>
        <div class="brand__text">
          <h1 data-i18n="app.title">RTSP Camera Manager</h1>
          <p data-i18n="app.subtitle"></p>
        </div>
      </div>
      <div class="masthead__side">
        <span class="chip chip--mono">v{{ addon_version }}</span>
        <label class="lang">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="lang__icon">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 21.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"></path>
          </svg>
          <span class="visually-hidden" data-i18n="app.language"></span>
          <select id="language-select"></select>
        </label>
      </div>
    </div>
    <ul class="statusstrip" id="status-strip"></ul>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" role="tab" data-panel="cameras" aria-selected="true">
      <span data-i18n="nav.cameras"></span>
      <span class="tab__count" id="tab-camera-count">0</span>
    </button>
    <button class="tab" role="tab" data-panel="settings" aria-selected="false">
      <span data-i18n="nav.settings"></span>
    </button>
    <button class="tab" role="tab" data-panel="help" aria-selected="false">
      <span data-i18n="nav.help"></span>
    </button>
  </nav>

  <main class="layout">
    <div id="banner-region" class="banner-region" aria-live="polite"></div>

    <section class="panel is-active" id="panel-cameras" role="tabpanel">
      <div class="toolbar">
        <button class="btn btn--primary" id="btn-add-camera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-i18n="camera.add"></span>
        </button>
        <button class="btn btn--ghost" id="btn-reload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"></path></svg>
          <span data-i18n="camera.reload_list"></span>
        </button>
        <p class="toolbar__hint" data-i18n="camera.test_ad_hoc_hint"></p>
      </div>
      <div class="grid" id="camera-list"></div>
      <div class="empty" id="camera-empty" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true" class="empty__art">
          <rect x="5" y="14" width="26" height="19" rx="4"></rect>
          <path d="M31 21.5 43 16v15l-12-5.5z"></path>
          <circle cx="14" cy="23.5" r="3.6"></circle>
        </svg>
        <h2 data-i18n="camera.empty_title"></h2>
        <p data-i18n="camera.empty_text"></p>
      </div>
    </section>

    <section class="panel" id="panel-settings" role="tabpanel" hidden>
      <h2 class="section__title" data-i18n="settings.title"></h2>
      <p class="note" data-i18n="settings.language_note"></p>
      <dl class="specs" id="settings-list"></dl>
    </section>

    <section class="panel" id="panel-help" role="tabpanel" hidden>
      <h2 class="section__title" data-i18n="help.title"></h2>
      <ol class="steps">
        <li class="step">
          <h3 data-i18n="help.step1_title"></h3>
          <p data-i18n="help.step1_text"></p>
        </li>
        <li class="step">
          <h3 data-i18n="help.step2_title"></h3>
          <p data-i18n="help.step2_text"></p>
        </li>
        <li class="step">
          <h3 data-i18n="help.step3_title"></h3>
          <p data-i18n="help.step3_text"></p>
        </li>
        <li class="step">
          <h3 data-i18n="help.step4_title"></h3>
          <p data-i18n="help.step4_text"></p>
        </li>
      </ol>
      <div class="callout">
        <h3 data-i18n="help.security_title"></h3>
        <p data-i18n="help.security_text"></p>
      </div>
    </section>
  </main>

  <div class="modal" id="camera-modal" hidden>
    <div class="modal__backdrop" data-close="camera-modal"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="camera-modal-title">
      <header class="modal__head">
        <h2 id="camera-modal-title" data-i18n="camera.add"></h2>
        <button type="button" class="icon-btn" data-close="camera-modal" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <form class="form" id="camera-form" novalidate>
        <label class="field">
          <span class="field__label" data-i18n="camera.name"></span>
          <input type="text" id="field-name" name="name" autocomplete="off" spellcheck="false" required>
          <span class="field__hint" data-i18n="camera.name_hint"></span>
        </label>

        <div class="field">
          <label class="field__label" for="field-url" data-i18n="camera.url"></label>
          <div class="field__row">
            <input type="text" id="field-url" name="url" autocomplete="off" spellcheck="false"
                   placeholder="rtsp://user:password@192.168.1.10:554/stream1" required>
            <button type="button" class="btn btn--ghost btn--icon" id="btn-reveal">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
              <span class="visually-hidden" data-i18n="camera.reveal"></span>
            </button>
          </div>
          <span class="field__hint mono" data-i18n="camera.url_hint"></span>
        </div>

        <div class="form__grid">
          <label class="field">
            <span class="field__label" data-i18n="camera.transport"></span>
            <select id="field-transport" name="rtsp_transport">
              <option value="tcp">tcp</option>
              <option value="udp">udp</option>
              <option value="udp_multicast">udp_multicast</option>
              <option value="http">http</option>
            </select>
          </label>
          <label class="switch">
            <input type="checkbox" id="field-enabled" name="enabled" checked>
            <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
            <span class="switch__label" data-i18n="camera.enabled"></span>
          </label>
        </div>
        <p class="note note--tight" data-i18n="camera.enabled_hint"></p>

        <div class="probe" id="probe-result" hidden></div>

        <footer class="modal__foot">
          <button type="button" class="btn btn--ghost" id="btn-test-form">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-5 4 10 2-5h4"></path></svg>
            <span data-i18n="camera.test"></span>
          </button>
          <button type="button" class="btn btn--ghost" id="btn-preview-form" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
            <span data-i18n="camera.preview"></span>
          </button>
          <span class="spacer"></span>
          <button type="button" class="btn btn--ghost" data-close="camera-modal" data-i18n="camera.cancel"></button>
          <button type="submit" class="btn btn--primary" id="btn-save" data-i18n="camera.save"></button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal modal--wide" id="preview-modal" hidden>
    <div class="modal__backdrop" data-close="preview-modal"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header class="modal__head">
        <h2 id="preview-title"></h2>
        <span class="chip chip--mono" id="preview-chip">mjpeg</span>
        <span class="spacer"></span>
        <label class="lang lang--tight">
          <span class="visually-hidden" data-i18n="preview.mode"></span>
          <select id="preview-mode-select">
            <option value="mjpeg" data-i18n="preview.mode_mjpeg"></option>
            <option value="hls" data-i18n="preview.mode_hls"></option>
          </select>
        </label>
        <button type="button" class="icon-btn" data-close="preview-modal" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div class="preview" id="preview-stage">
        <p class="preview__placeholder" id="preview-placeholder" data-i18n="preview.loading"></p>
        <img id="preview-image" alt="" hidden>
        <video id="preview-video" playsinline muted hidden></video>
        <div class="preview__scan" aria-hidden="true"></div>
      </div>
      <p class="preview__error" id="preview-error" hidden></p>
      <footer class="modal__foot">
        <p class="note note--tight" data-i18n="preview.hint"></p>
        <span class="spacer"></span>
        <button type="button" class="btn btn--primary" data-close="preview-modal" data-i18n="preview.close"></button>
      </footer>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script id="bootstrap" type="application/json">{{ bootstrap|safe }}</script>
  <script src="{{ base_path }}/static/app.js" defer></script>
</body>
</html>
