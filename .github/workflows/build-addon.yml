name: Build add-on image

# Builds the multi-arch image of the app and publishes it to the GitHub Container
# Registry, so Supervisor pulls the image instead of building it on the Home
# Assistant host.
#
# The generic manifest name (${REGISTRY}/${OWNER}/${IMAGE_NAME}) must stay in sync
# with the "image" key of rtsp_cameras/config.yaml, and the published tags are the
# add-on version plus "latest".

on:
  push:
    branches: [main]
    paths:
      - "rtsp_cameras/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rtsp-cameras

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare the build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the add-on version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oP '(?<=^version: ")[^"]+' rtsp_cameras/config.yaml)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Prepare the build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix='{"include":['
          matrix+='{"arch":"amd64","platform":"linux/amd64","os":"ubuntu-24.04"},'
          matrix+='{"arch":"aarch64","platform":"linux/arm64","os":"ubuntu-24.04-arm"}'
          matrix+=']}'
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.arch }} image
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -uo pipefail
          owner="${OWNER,,}" # container registry paths have to be lowercase
          tag="${REGISTRY}/${owner}/${ARCH}-${IMAGE_NAME}:${VERSION}"
          log="$(mktemp)"

          if ! docker build \
                --platform "${PLATFORM}" \
                --build-arg "BUILD_VERSION=${VERSION}" \
                --build-arg "BUILD_ARCH=${ARCH}" \
                --tag "${tag}" \
                rtsp_cameras > "${log}" 2>&1; then
            tail -n 25 "${log}"
            echo "::error title=Docker build failed for ${ARCH}::$(tail -n 15 "${log}" | tr '\n' '|')"
            exit 1
          fi

          if ! docker push "${tag}" > "${log}" 2>&1; then
            tail -n 25 "${log}"
            echo "::error title=Docker push failed for ${ARCH}::$(tail -n 15 "${log}" | tr '\n' '|')"
            exit 1
          fi

          tail -n 5 "${log}"
          echo "Published ${tag}"

  manifest:
    name: Publish the multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}" # container registry paths have to be lowercase
          image="${REGISTRY}/${owner}/${IMAGE_NAME}"
          sources=(
            "${REGISTRY}/${owner}/amd64-${IMAGE_NAME}:${VERSION}"
            "${REGISTRY}/${owner}/aarch64-${IMAGE_NAME}:${VERSION}"
          )
          docker buildx imagetools create \
            --tag "${image}:${VERSION}" \
            --tag "${image}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${image}:${VERSION}"
