name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Check the sync of the integration copy
        run: python -m pytest -q rtsp_cameras/tests/test_manifests.py

      - name: Validate the add-on manifest
        run: |
          python - <<'PY'
          import json
          import pathlib

          import yaml

          config = yaml.safe_load(pathlib.Path("rtsp_cameras/config.yaml").read_text())
          manifest = json.loads(
              pathlib.Path("custom_components/rtsp_cameras/manifest.json").read_text()
          )
          assert config["version"] == manifest["version"], "versions differ"
          assert set(config["options"]) == set(config["schema"]), "options/schema differ"
          print("manifest is consistent:", config["version"])
          PY
