name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Report the unit test failures
        if: failure()
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("pytest-report.xml")
          if not report.exists():
              print("::error::the unit tests left no report")
              raise SystemExit(0)
          found = False
          for case in ET.parse(report).getroot().iter("testcase"):
              for node in [*case.findall("failure"), *case.findall("error")]:
                  found = True
                  detail = " | ".join((node.text or "").strip().splitlines()[-4:])
                  location = f"file={case.get('file') or 'rtsp_cameras'},line={case.get('line') or 1}"
                  print(f"::error {location},title={case.get('name') or 'test'}::{detail[:900]}")
          if not found:
              print("::error::the report holds no failing test case")
          PY

      - name: Check the sync of the integration copy
        run: python -m pytest -q rtsp_cameras/tests/test_manifests.py

      - name: Validate the add-on manifest
        run: |
          python - <<'PY'
          import json
          import pathlib

          import yaml

          config = yaml.safe_load(pathlib.Path("rtsp_cameras/config.yaml").read_text())
          manifest = json.loads(
              pathlib.Path("custom_components/rtsp_cameras/manifest.json").read_text()
          )
          assert config["version"] == manifest["version"], "versions differ"
          assert set(config["options"]) == set(config["schema"]), "options/schema differ"
          print("manifest is consistent:", config["version"])
          PY

  integration:
    name: Camera entities on a real Home Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-homeassistant-custom-component av

      - name: Cameras published by the add-on become camera entities
        run: python -m pytest -c ha_tests/pytest.ini ha_tests -q

